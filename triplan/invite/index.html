<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>TriPlan invitation</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { align-items: center; background: #f7f8fa; color: #202124; display: flex; justify-content: center; margin: 0; min-height: 100vh; }
      main { box-sizing: border-box; max-width: 420px; padding: 32px 24px; text-align: center; width: 100%; }
      h1 { font-size: 24px; margin: 0 0 12px; }
      p { color: #5f6368; line-height: 1.6; margin: 0 0 24px; }
      a { border-radius: 12px; display: block; font-weight: 700; padding: 15px 20px; text-decoration: none; }
      #open-app { background: #3d6df2; color: #fff; }
      .store-links { align-items: center; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
      .store-links a { align-items: center; box-sizing: border-box; display: flex; height: 56px; justify-content: center; padding: 0; width: 176px; }
      .store-links img { height: 22px; margin-right: 9px; width: 22px; }
      #open-play-store { background: #fff; border: 1px solid #dadce0; color: #3c4043; }
      #open-app-store { background: #000; border: 1px solid #000; color: #fff; }
      #open-app-store img { filter: invert(1); }
      small { color: #80868b; display: block; line-height: 1.5; margin-top: 18px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">TriPlan 여행에 초대되었어요!</h1>
      <p id="description">TriPlan 앱에서 여행방을 여는 중이에요.</p>
      <a id="open-app" href="#">앱에서 초대 열기</a>
      <div class="store-links">
        <a id="open-play-store" href="https://play.google.com/store/apps/details?id=com.sandy.triplan" aria-label="Google Play">
          <img src="https://cdn.simpleicons.org/googleplay/202124" alt="" />
          Google Play
        </a>
        <a id="open-app-store" href="https://apps.apple.com/app/id6766812806" aria-label="App Store">
          <img src="https://cdn.simpleicons.org/appstore/202124" alt="" />
          App Store
        </a>
      </div>
      <small id="help">앱이 설치되어 있지 않다면 TriPlan을 설치한 뒤 이 링크를 다시 열어 주세요.</small>
    </main>
    <script>
      (() => {
        const isKorean = navigator.language.toLowerCase().startsWith('ko');
        const copy = isKorean
          ? {
              title: 'TriPlan 여행에 초대되었어요!',
              description: 'TriPlan 앱에서 여행방을 여는 중이에요.',
              openApp: '앱에서 초대 열기',
              help: '앱이 설치되어 있지 않다면 TriPlan을 설치한 뒤 이 링크를 다시 열어 주세요.',
              invalidTitle: '유효하지 않은 초대 링크예요',
              invalidDescription: '초대받은 링크를 다시 확인해 주세요.',
            }
          : {
              title: 'You’re invited to a TriPlan trip',
              description: 'Opening this trip in the TriPlan app.',
              openApp: 'Open invitation in the app',
              help: 'If TriPlan is not installed, install it and open this link again.',
              invalidTitle: 'This invitation link is invalid',
              invalidDescription: 'Please check the invitation link and try again.',
            };
        document.documentElement.lang = isKorean ? 'ko' : 'en';
        document.getElementById('title').textContent = copy.title;
        document.getElementById('description').textContent = copy.description;
        document.getElementById('open-app').textContent = copy.openApp;
        document.getElementById('help').textContent = copy.help;

        const params = new URLSearchParams(window.location.search);
        const travelRemoteId = params.get('travelRemoteId');
        const inviteCode = params.get('inviteCode');
        const openApp = document.getElementById('open-app');

        if (!travelRemoteId || !inviteCode) {
          document.getElementById('title').textContent = copy.invalidTitle;
          document.getElementById('description').textContent = copy.invalidDescription;
          openApp.style.display = 'none';
          return;
        }

        const appUri = new URL('triplan://invite');
        appUri.searchParams.set('travelRemoteId', travelRemoteId);
        appUri.searchParams.set('inviteCode', inviteCode);
        openApp.href = appUri.toString();

        window.setTimeout(() => {
          window.location.href = appUri.toString();
        }, 100);
      })();
    </script>
  </body>
</html>
